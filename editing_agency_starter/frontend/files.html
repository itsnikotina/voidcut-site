<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOIDCUT — Project Files</title>
<link rel="icon" type="image/x-icon" href="kittyyyy.ico">
<link rel="shortcut icon" href="kittyyyy.ico">
<link rel="stylesheet" href="styles.css">
<style>
  .files-container { max-width: 800px; margin: 40px auto; padding: 20px; }
  .dropzone { border: 2px dashed #777; border-radius: 8px; padding: 50px; text-align: center; color: #777; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
  .dropzone:hover, .dropzone.dragover { border-color: var(--acid); color: var(--acid); background: rgba(225,255,0,0.05); }
  .file-list { margin-top: 20px; }
  .file-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 10px; }
  .file-info { display: flex; flex-direction: column; }
  .file-name { font-weight: 500; color: #fff; }
  .file-size { font-size: 0.85rem; color: #777; }
  .file-actions { display: flex; gap: 10px; align-items: center; }
  #uploadProgress { display: none; width: 100%; margin-top: 10px; }
</style>
</head>
<body class="dashboard-page">
<header class="nav">
  <a class="brand" href="index.html"><img src="LOGOarredondada.png" alt="VOIDCUT" style="width:34px;height:34px;object-fit:contain;border-radius:6px;"> VOIDCUT</a>
  <div class="dash-user">PROJECT FILES</div>
</header>
<main class="files-container">
  <div class="dash-title">
    <div>
      <span class="eyebrow" id="jobIdLabel">LOADING...</span>
      <h1>SECURE FILE PORTAL</h1>
      <p style="color: #777; margin-top: 5px;">Upload and manage files for this project. Files are stored securely.</p>
    </div>
  </div>

  <div id="dropzone" class="dropzone">
    <div style="width: 42px; margin: 0 auto 15px;">
      <svg fill="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M16 4h-6v2H8v2H4v2H2v2H0v6h2v2h20v-2h2v-6h-2v-2h-2V8h-2V6h-2V4zm2 8h4v6H2v-6h2v-2h4v2h2v-2H8V8h2V6h6v2h2v4zm0 0v2h-2v-2h2z" fill="currentColor"/></svg>
    </div>
    <h3>Drag & Drop files here</h3>
    <p>or click to select files (Max 100GB per project)</p>
    <input type="file" id="fileInput" style="display: none" multiple>
  </div>
  
  <div id="progressContainer" style="display:none; margin-bottom: 20px;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
      <span id="progressText" style="color: var(--acid); font-weight: 600;">Uploading...</span>
      <span id="progressPercent" style="color: #777;">0%</span>
    </div>
    <progress id="uploadProgress" value="0" max="100" style="display: block;"></progress>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>PROJECT FILES</h2>
      <div id="folderStats" style="font: 10px 'DM Mono'; color: #777; text-transform: uppercase;">0 files • 0 Bytes</div>
    </div>
    <div id="fileList" class="file-list">
      <div style="padding: 20px; text-align: center; color: #777;">Loading files...</div>
    </div>
  </div>
  <div id="errorModal" class="modal hidden">
    <div class="modal-box" style="border-color: var(--red);">
      <button class="close" onclick="document.getElementById('errorModal').classList.add('hidden')">&times;</button>
      <h2 style="font-size: 32px; margin-top: 0; color: var(--red);">UPLOAD ERROR</h2>
      <p id="errorModalMessage" style="color: #ccc;"></p>
      <button class="button secondary" onclick="document.getElementById('errorModal').classList.add('hidden')">Got it</button>
    </div>
  </div>
</main>
<script src="files.js"></script>
</body>
</html>
